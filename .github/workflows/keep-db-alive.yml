name: Keep DB Alive

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-db-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set"
            exit 1
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT 1;"
